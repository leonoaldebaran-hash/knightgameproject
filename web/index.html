<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knight Game Project</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    canvas { width: 640px; height: 480px; flex-shrink: 0; background: #000; outline: none; }
    button { background: #333; color: #ddd; border: 1px solid #555; padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <button onclick="Module.requestFullscreen(false, false)">Tela cheia</button>
  <script>
    var Module = { canvas: document.getElementById('canvas') };
    document.getElementById('canvas').addEventListener('click', function () { this.focus(); });

    // A página pode vir do cache do navegador; o version.json é sempre buscado de novo
    // e diz qual arquivo do jogo é o atual. Assim nunca carregamos uma versão que já não existe.
    function loadGame(file) {
      var s = document.createElement('script');
      s.src = file;
      document.body.appendChild(s);
    }
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) { loadGame(v.js); })
      .catch(function () { loadGame('__GAME_JS__'); });
  </script>
</body>
</html>
