name: Analisar músicas

on:
  push:
    branches: [main]
    paths: ['assets/music_src/**', 'tools/analyze_music.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas de áudio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install librosa==0.10.2.post1 "numpy<2.1"

      - name: Analisar
        run: python tools/analyze_music.py

      - name: Salvar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MUSICA_ANALISE.md
          git diff --cached --quiet || git commit -m "Update music analysis"
          git pull --rebase
          git push
