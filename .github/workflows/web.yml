name: Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Baixar raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib

      - name: Compilar raylib para Web
        run: |
          mkdir -p build/raylib
          for f in rcore rshapes rtextures rtext rmodels utils raudio; do
            emcc -c raylib/src/$f.c -o build/raylib/$f.o -Os -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          done
          emar rcs build/libraylib.a build/raylib/*.o

      - name: Compilar o jogo
        run: |
          mkdir -p public
          VERSION=$(echo "$GITHUB_SHA" | cut -c1-7)
          # Nome novo a cada build para o navegador nunca usar uma versão antiga do cache
          emcc src/*.c build/libraylib.a -o public/game-$VERSION.js -Os -Wall \
            -Iraylib/src -DPLATFORM_WEB -DGAME_VERSION="\"$VERSION\"" \
            -s USE_GLFW=3 -s ALLOW_MEMORY_GROWTH=1
          sed "s/__GAME_JS__/game-$VERSION.js/" web/index.html > public/index.html

      - name: Converter as músicas para o estilo N64
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p public/music
          for f in assets/music_src/*.mp3; do
            name=$(basename "$f" .mp3)
            # 32 kHz e agudos cortados: o som mais "quente" e abafado dos cartuchos de N64.
            # loudnorm deixa todas as faixas no mesmo volume.
            ffmpeg -loglevel error -y -i "$f" \
              -af "loudnorm=I=-16:TP=-1.5,lowpass=f=12000,aresample=32000" \
              -c:a libvorbis -q:a 2 "public/music/$name.ogg"
          done
          ls -la public/music

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
