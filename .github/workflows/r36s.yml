name: Build R36S

on:
  push:
    branches: [main, ci-test-tarefa2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Instalar dependÃªncias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates libsdl2-dev

      - uses: actions/checkout@v4

      - name: Baixar raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib

      - name: Compilar raylib para o R36S
        run: |
          mkdir -p build/raylib
          for f in rcore rshapes rtextures rtext rmodels utils raudio; do
            gcc -c raylib/src/$f.c -o build/raylib/$f.o -O2 \
              -DPLATFORM_DESKTOP_SDL -DGRAPHICS_API_OPENGL_ES2 -I/usr/include/SDL2
          done
          ar rcs build/libraylib.a build/raylib/*.o

      - name: Compilar o jogo
        run: |
          gcc src/main.c build/libraylib.a -o build/knightgame -O2 -Wall \
            -Iraylib/src -DPLATFORM_DESKTOP_SDL -lSDL2 -lm -ldl -lpthread

      - name: Montar o pacote
        run: |
          mkdir -p package/knightgame
          cp build/knightgame package/knightgame/
          cp port/Knight\ Game.sh package/

      - uses: actions/upload-artifact@v4
        with:
          name: knightgame-r36s
          path: package
